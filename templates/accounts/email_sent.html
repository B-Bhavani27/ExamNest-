<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Sent | ExamNest</title>
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --primary:#8B5CF6;
    --primary-dark:#7443F1;
    --bg:#F8F7FF;
}

body{
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    max-width:600px;
    width:100%;
    border:none;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.icon{
    font-size:70px;
    color:#28a745;
}

h2{
    color:var(--primary);
    margin-top:20px;
    font-weight:700;
}

p{
    color:#666;
    margin-top:15px;
}

.btn-home{
    margin-top:25px;
    background:var(--primary);
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    text-decoration:none;
}

.btn-home:hover{
    background:var(--primary-dark);
    color:white;
}

</style>

</head>

<body>

<div class="card">

<div class="icon">
✅
</div>

<h2>Registration Successful!</h2>

<p>

Your registration has been completed successfully.

</p>

<p>

An activation email has been sent to your registered email address.

Please check your inbox (and Spam folder if needed), then click the activation link to create your password.

</p>

<a href="{% url 'index' %}" class="btn-home">

Return to Home

</a>

</div>

</body>
</html>
