{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | ExamNest</title>
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --primary:#8B5CF6;
    --primary-dark:#7443F1;
    --bg:#F8F7FF;
    --card:#FFFFFF;
    --text:#444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
}

/* Main */

.main-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.wrapper{
    width:100%;
    max-width:550px;
}

/* Header */

.page-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}

.logo-circle{
    width:90px;
    height:90px;
    min-width:90px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid var(--primary);
    background:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,.25);
}

.logo-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-text{
    text-align:left;
}

.header-text h2{
    margin:0;
    color:var(--primary);
    font-weight:700;
}

.header-text p{
    margin:0;
    color:#666;
    font-size:14px;
}

/* Card */

.login-card{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    animation:fadeUp .6s ease;
}

.login-card h4{
    text-align:center;
    color:var(--primary);
    margin-bottom:25px;
    font-weight:700;
}

/* Inputs */

.form-label{
    font-weight:600;
}

.form-control{
    border-radius:12px;
    padding:12px;
}

.form-control:focus{
    border-color:var(--primary);
    box-shadow:0 0 12px rgba(139,92,246,.25);
}

/* Password */

.password-box{
    position:relative;
}

.password-input{
    padding-right:50px !important;
}

#togglePassword{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    cursor:pointer;
    color:var(--primary);
    font-size:18px;
}

/* Button */

.btn-login{
    width:100%;
    border:none;
    border-radius:12px;
    padding:12px;
    background:var(--primary);
    color:white;
    font-weight:600;
    transition:.3s;
}

.btn-login:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}

/* Register */

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:var(--primary);
    text-decoration:none;
    font-weight:600;
}

.register-link a:hover{
    text-decoration:underline;
}

/* Footer */

footer{
    text-align:center;
    padding:15px;
    color:#666;
    font-size:14px;
}

/* Animation */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */

@media(max-width:576px){

    .logo-circle{
        width:70px;
        height:70px;
        min-width:70px;
    }

    .header-text h2{
        font-size:24px;
    }

    .header-text p{
        font-size:12px;
    }

    .login-card{
        padding:25px;
    }

}

</style>

</head>

<body>

<div class="main-container">

<div class="wrapper">

<!-- Header -->

<div class="page-header">

<div class="logo-circle">
    <img src="{% static 'images/logo.png' %}" alt="ExamNest Logo">
</div>

<div class="header-text">
    <h2>ExamNest</h2>
    <p>Your Exam. Your Effort. Your Achievement.</p>
</div>

</div>

<!-- Login Card -->

<div class="login-card">

<h4>Student Login</h4>

<form method="POST">
{% csrf_token %}

{% if error %}
<div class="alert alert-danger alert-dismissible fade show" role="alert">

    <i class="fas fa-circle-exclamation"></i>
    {{ error }}

    <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert">
    </button>

</div>
{% endif %}


<div class="mb-3">
<label class="form-label">Student ID or Email</label>

<input
type="text"
name="login_id"
class="form-control"
placeholder="Enter Student ID or Email"
required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<div class="password-box">

<input
type="password"
id="password"
name="password"
class="form-control password-input"
placeholder="Enter Password"
required>

<span id="togglePassword">
<i class="fas fa-eye"></i>
</span>

</div>

</div>
<div class="text-end mb-3">
    <a href="{% url 'forgot_password' %}"
       style="text-decoration:none;color:#8B5CF6;font-weight:600;">
        Forgot Password?
    </a>
</div>
<button type="submit" class="btn btn-login">
Login
</button>

<div class="register-link">
Don't have an account?
<a href="{% url 'student_register' %}">
Register
</a>
</div>

</form>

</div>

</div>

</div>

<footer>
<strong>ExamNest</strong><br>
Your Exam. Your Effort. Your Achievement.<br>
© 2026 All Rights Reserved
</footer>

<script>

const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function(){

    const icon = this.querySelector("i");

    if(password.type === "password"){

        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    }else{

        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
