<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Activation | ExamNest</title>
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --primary:#8B5CF6;
    --primary-dark:#7443F1;
    --bg:#F8F7FF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
}

.main-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.wrapper{
    width:100%;
    max-width:550px;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}

.logo-circle{
    width:90px;
    height:90px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid var(--primary);
    background:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,.25);
}

.logo-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-text{
    text-align:left;
}

.header-text h2{
    margin:0;
    color:var(--primary);
    font-weight:700;
}

.header-text p{
    margin:0;
    color:#666;
    font-size:14px;
}

.activation-card{
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.activation-card h4{
    text-align:center;
    color:var(--primary);
    margin-bottom:25px;
    font-weight:700;
}

.form-control{
    border-radius:12px;
    padding:12px;
}

.form-control:focus{
    border-color:var(--primary);
    box-shadow:0 0 10px rgba(139,92,246,.25);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.password-box i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:var(--primary);
    font-size:18px;
}

.btn-activate{
    width:100%;
    border:none;
    border-radius:12px;
    padding:12px;
    background:var(--primary);
    color:white;
    font-weight:600;
    transition:.3s;
}

.btn-activate:hover{
    background:var(--primary-dark);
}

.info-text{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

.student-id-box{
    background:#EDE9FE;
    padding:12px;
    border-radius:12px;
    text-align:center;
    font-weight:600;
    color:var(--primary);
    margin-bottom:20px;
}

footer{
    text-align:center;
    padding:15px;
    color:#666;
}

@media(max-width:576px){

    .logo-circle{
        width:70px;
        height:70px;
    }

    .header-text h2{
        font-size:24px;
    }

    .header-text p{
        font-size:12px;
    }

    .activation-card{
        padding:25px;
    }

}

</style>
</head>

<body>

<div class="main-container">

<div class="wrapper">

<div class="page-header">

<div class="logo-circle">
<img src="logo.png" alt="ExamNest Logo">
</div>

<div class="header-text">
<h2>ExamNest</h2>
<p>Your Exam. Your Effort. Your Achievement.</p>
</div>

</div>

<div class="activation-card">

<h4>Account Activation</h4>

<p class="info-text">
Create your password to activate your ExamNest account.
</p>

<div class="student-id-box">
Student ID : {{ student.student_id }}
</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Registered Email</label>
<input type="email"
class="form-control"
value="{{ student.email }}"
readonly>
</div>

<div class="mb-3">
<label class="form-label">Create Password</label>

<div class="password-box">

<input type="password"
id="password"
name="password"
class="form-control"
placeholder="Enter New Password"
required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>

<div class="password-box">

<input type="password"
id="confirmPassword"
name="confirm_password"
class="form-control"
placeholder="Confirm Password"
required>

<i class="fa-solid fa-eye" id="toggleConfirm"></i>

</div>

</div>

<button type="submit" class="btn btn-activate">
Activate Account
</button>

</form>

</div>

</div>

</div>

<footer>
<strong>ExamNest</strong><br>
Your Exam. Your Effort. Your Achievement.<br>
© 2026 All Rights Reserved
</footer>

<script>

function togglePassword(inputId, iconId){

const input = document.getElementById(inputId);
const icon = document.getElementById(iconId);

icon.addEventListener("click",()=>{

if(input.type==="password"){

input.type="text";
icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");

}else{

input.type="password";
icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}

});

}

togglePassword("password","togglePassword");
togglePassword("confirmPassword","toggleConfirm");

</script>

</body>
</html>
