{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | ExamNest</title>
<link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --primary:#8B5CF6;
    --primary-dark:#7443F1;
    --bg:#F8F7FF;
}

body{
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.main-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.wrapper{
    width:100%;
    max-width:550px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid var(--primary);
}

.logo h2{
    color:var(--primary);
    margin-top:15px;
}

.card-box{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.password-box i{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    cursor:pointer;
    color:var(--primary);
}

.btn-save{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-weight:bold;
}

.btn-save:hover{
    background:var(--primary-dark);
}

footer{
    text-align:center;
    padding:15px;
    color:#666;
}

</style>

</head>

<body>

<div class="main-container">

<div class="wrapper">

<div class="logo">

<img src="{% static 'images/logo.png' %}">

<h2>ExamNest</h2>

<p>Your Exam. Your Effort. Your Achievement.</p>

</div>

<div class="card-box">

<h4 class="text-center mb-4 text-primary">

Reset Password

</h4>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>New Password</label>

<div class="password-box">

<input
type="password"
name="password"
id="password"
class="form-control"
required>

<i class="fa-solid fa-eye"
id="eye1"></i>

</div>

</div>

<div class="mb-4">

<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
name="confirm_password"
id="confirm"
class="form-control"
required>

<i class="fa-solid fa-eye"
id="eye2"></i>

</div>

</div>

<button
type="submit"
class="btn-save">

Update Password

</button>

</form>

</div>

</div>

</div>

<footer>

<strong>ExamNest</strong><br>

© 2026 All Rights Reserved

</footer>

<script>

function toggle(id,input){

document.getElementById(id).onclick=function(){

const box=document.getElementById(input);

if(box.type==="password"){

box.type="text";

this.classList.replace("fa-eye","fa-eye-slash");

}else{

box.type="password";

this.classList.replace("fa-eye-slash","fa-eye");

}

}

}

toggle("eye1","password");

toggle("eye2","confirm");

</script>

</body>
</html>
