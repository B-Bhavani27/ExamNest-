<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | ExamNest</title>
<link rel="icon" type="image/png" href=#>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#7C3AED; --primary-dark:#5B21B6; --primary-light:#EDE7FE;
    --bg:#F5F7FB; --white:#ffffff; --grey:#8A8FA3; --black:#1E1B2E;
    --danger:#F04438;
    --shadow-hover: 0 14px 34px rgba(31,26,74,0.12);
    --radius-lg:20px;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter', sans-serif;
    background:linear-gradient(135deg, #1E1B2E, #3B2A6B);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  h1,h2,h3,h4,h5{font-family:'Sora', sans-serif;}
  .login-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-hover);
    padding:44px;
    width:100%; max-width:420px;
  }
  .login-icon{
    width:60px; height:60px; border-radius:16px;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; margin:0 auto 18px;
  }
  .login-card h4{font-weight:800; text-align:center; margin-bottom:6px;}
  .login-card p.sub{text-align:center; color:var(--grey); font-size:.88rem; margin-bottom:28px;}
  .form-label{font-weight:700; font-size:.85rem; color:var(--black); margin-bottom:6px;}
  .form-control{
    border-radius:12px; border:1.5px solid rgba(124,58,237,0.15);
    padding:12px 16px; font-size:.92rem;
  }
  .form-control:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light);}
  .btn-login{
    background:var(--primary); color:var(--white); border:none;
    padding:13px; border-radius:50px; font-weight:700; font-size:.95rem;
    width:100%; margin-top:10px; transition:all .3s ease;
    box-shadow:0 6px 16px rgba(124,58,237,0.28);
  }
  .btn-login:hover{background:var(--primary-dark); color:var(--white);}
  .alert-error{
    background:#FDEDEB; color:var(--danger); border:none;
    border-radius:12px; padding:12px 16px; font-size:.85rem; font-weight:600;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-icon"><i class="fa-solid fa-user-shield"></i></div>
  <h4>Admin Login</h4>
  <p class="sub">ExamNest Admin Dashboard</p>

  {% if error %}
  <div class="alert-error mb-3">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" placeholder="admin@examnest.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">
      <i class="fa-solid fa-right-to-bracket me-2"></i>Login
    </button>
  </form>
</div>

</body>
</html>
